name: CI

# Core build and tests on every pull request and every push to main.
# Modeled on syrtis (Nanako0129/syrtis .github/workflows/ci.yml).
# The workflow always runs, so every main commit keeps a concluded run for the
# release gate (scripts/check-ci-gate.sh); the `changes` job skips the macOS
# jobs when only documentation or the website changed (scripts/ci-changes.sh),
# and skipped jobs leave the run's conclusion `success`.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR branch makes the previous run moot; pushes to main key on
# the run id so every main commit keeps its own run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # actions: read lets the push case look up the previous main commit's run.
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      # Full history without file contents: enough for `git diff --name-only`.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: diff
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A new branch (all-zero before) or a base outside the history (force
          # push) cannot be diffed, so everything runs.
          if [[ "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            run=true
          else
            # A PR compares against the merge base (three dots); a push compares
            # the two trees directly (two dots), so commits a force push dropped
            # from main still count. --no-renames: rename detection would fetch
            # file contents; listing both the old and the new path is also the
            # conservative answer.
            range="$BASE..$GITHUB_SHA"
            [[ "$GITHUB_EVENT_NAME" == pull_request ]] && range="$BASE...$GITHUB_SHA"
            run=$(git diff --no-renames --name-only "$range" | scripts/ci-changes.sh | sed 's/^run=//')
          fi
          # On main, a skip is only safe when the previous commit's run passed:
          # otherwise a docs-only commit after a red, cancelled or unfinished
          # run would conclude `success` and clear the release gate
          # (scripts/check-ci-gate.sh) for code that last failed. The check sees
          # the previous run as it is at decision time: a later re-run of that
          # commit that turns red does not reach commits already skipped.
          if [[ "$run" == false && "$GITHUB_EVENT_NAME" == push ]]; then
            prev=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$BASE&event=push&branch=main&per_page=100" \
                     --jq '[.workflow_runs[]] | sort_by(.created_at) | last | .conclusion // "none"' 2>/dev/null || echo none)
            echo "previous main run for $BASE: $prev"
            [[ "$prev" == success ]] || run=true
          fi
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"

  core:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    # Xcode 27 / macOS 27, the same image the Swift shell (S3b) will need.
    runs-on: xcode-27
    # A full run takes about 3 minutes; a hung FFI child process should not
    # hold the runner for the 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Pinned to the toolchain the golden files were generated with: scores
      # must be bit-identical to the Python reference, and a codegen change
      # has already moved one result by 1 ulp (docs/contracts/s3a.md section 9,
      # powf lowered to exp10). The action is pinned to a master commit, as its
      # README recommends; the `stable` branch is regenerated on every merge.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.97.1

      # The bigram model is not in git (docs/PLAN.md S2c); it is the model-v6
      # release asset, its word-class table (S2k) is the classes-v5 asset and its
      # Kneser-Ney side file (kn-core) is the kn-v1 asset. The small model of
      # 語意校正 (S7c-2b) is the sj-sr-6-14m asset (會意 SJ-SR-6-14M, SJTL0004: it records model-v6's and kn-v1's hashes).
      # The trigram table of the formal profile (trigram-core) is the sj-cx-1-7.7m asset (bound to model-v6's hash).
      # The colloquial table (常談 SJ-CL-1-68K, colloquial-term.md) and its attribution list are the sj-cl-1-68k assets.
      # Checking them here fails the run in seconds with a clear message instead
      # of after the build. The hashes are checked against data/bigram.sjlm.sha256,
      # data/classes.sjc.sha256, data/kn.sjkn.sha256, data/tinylm.sjtl.sha256, data/trigram.sjt3.sha256, data/colloquial.sjlm.sha256 and data/colloquial-attribution.tsv.sha256 (also read by build-app.sh and release.yml);
      # cli/tests/golden.rs repeats the first two, so a model switch updates both (docs/data-files.md).
      - name: Fetch the language model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download model-v6 --repo "$GITHUB_REPOSITORY" -p bigram.sjlm -D data/lm
          shasum -a 256 -c data/bigram.sjlm.sha256
          gh release download classes-v5 --repo "$GITHUB_REPOSITORY" -p classes.sjc -D data/lm
          shasum -a 256 -c data/classes.sjc.sha256
          gh release download kn-v1 --repo "$GITHUB_REPOSITORY" -p kn.sjkn -D data/lm
          shasum -a 256 -c data/kn.sjkn.sha256
          gh release download sj-sr-6-14m --repo "$GITHUB_REPOSITORY" -p tinylm.sjtl -D data/lm
          shasum -a 256 -c data/tinylm.sjtl.sha256
          gh release download sj-cx-1-7.7m --repo "$GITHUB_REPOSITORY" -p trigram.sjt3 -D data/lm
          shasum -a 256 -c data/trigram.sjt3.sha256
          gh release download sj-cl-1-68k --repo "$GITHUB_REPOSITORY" -p colloquial.sjlm -p colloquial-attribution.tsv -D data/lm
          shasum -a 256 -c data/colloquial.sjlm.sha256 data/colloquial-attribution.tsv.sha256

      # Release also enforces the per-key p95 < 16 ms assertions in the replays.
      - name: Tests (release)
        run: |
          sysctl -n hw.ncpu hw.memsize
          RUSTC_BOOTSTRAP=1 cargo test --release --locked -- -Z unstable-options --report-time

      # docs/contracts/s3a.md section 7.4: compile the C header against the
      # staticlib and drive both layouts, the LM and the profile switch.
      # macOS cc links without the native libs too, so an empty capture would
      # pass silently; it is captured and checked first.
      - name: C header smoke test
        shell: bash
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP"
          LIBS=$(cargo rustc --color never --release --locked -p core --crate-type staticlib -- --print native-static-libs 2>&1 | sed -n 's/.*native-static-libs: //p')
          test -n "$LIBS"
          cc -std=c11 -Wall -Wextra -Werror -Icore/include core/tests/c/abi_smoke.c target/release/libcore.a $LIBS -o "$T/abi_smoke"
          "$T/abi_smoke" data/lexicon data/lm/bigram.sjlm
          # S4: a third argument (a fresh learning directory) runs the learning checks 518-521.
          "$T/abi_smoke" data/lexicon data/lm/bigram.sjlm "$T/learn"

      # docs/PLAN.md S2v acceptance 3: Rust and Python lenient comparison agree
      # on every probe line, and the variant table is actually applied.
      - name: Lenient comparison parity (Rust vs Python)
        shell: bash
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP"
          python3 tools/build_variants.py --probe > "$T/probe.txt"
          python3 reference/proto/eval.py --lenient-dump "$T/probe.txt" > "$T/py.txt"
          cargo run --release --locked -q -p cli -- --lenient-dump "$T/probe.txt" > "$T/rs.txt"
          diff "$T/py.txt" "$T/rs.txt"
          N=$(grep -vc '^#' eval/variants.tsv)
          diff <(head -n "$N" "$T/rs.txt") <(grep -v '^#' eval/variants.tsv | cut -f2)

      # docs/contracts/s2r-sandhi-variants.md sections 1, 3 and 4.0: the sandhi
      # rows and the public probe rebuild byte for byte, and Python's unigram
      # decode with both overlays matches the Rust goldens.
      - name: Sandhi rows, probe and unigram parity
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_sandhi.py --check
          python3 experiments/s2/build_probe.py --check
          python3 reference/proto/check_unigram_overlay.py
          python3 reference/proto/test_demote.py

      # numpy for the Python steps that need it. The runner's python3 has none; with trigram.sjt3 beside the model,
      # lm_eval.py --profile formal imports reference/proto/trigram.py (numpy), and the X0c and trigram-table tests need it too.
      # Steps that do not need numpy keep the runner's python3.
      - name: Python venv with numpy
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/x0c-venv"
          "$RUNNER_TEMP/x0c-venv/bin/python" -m pip install --quiet numpy==2.5.4

      # docs/contracts/eval-stats.md: the statistics tests, and the Python rowstats of dev302 equal
      # the golden the Rust CLI is compared with (cli/tests/golden.rs), so both writers are held.
      # The formal pass reads the trigram table beside the model, so both passes run in the numpy venv.
      - name: Eval statistics (Python)
        shell: bash
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP"
          python3 -m unittest tools.test_evalstats
          for p in chat formal; do
            "$T/x0c-venv/bin/python" reference/proto/lm_eval.py --profile "$p" --dev 302 --rowstats "$T/$p.rowstats" > /dev/null
            cmp "$T/$p.rowstats" "eval/golden/s2-lm-dev302-$p.rowstats"
          done

      # docs/contracts/acg-pack.md A.5: the pack builder against a fake API (dedupe, collision dispositions, ordering,
      # deterministic output) and the committed pack against the lexicon. Builds the evaluation CLI for the collision detection.
      - name: ACG pack builder (Python)
        run: python3 -m unittest tools.test_build_acg_pack

      # docs/contracts/names-lexicon.md section 3 items 6 and 8: the common proper-noun builder against fixtures and a fake API, and the
      # committed names-add.tsv sharing no word with the base, overlay-add, sandhi-add and acg-add.
      - name: Names lexicon builder (Python)
        run: python3 -m unittest tools.test_build_names

      # docs/contracts/model-v5.md sections 8-9: the count scripts' --extra-lexicon (additive counting), the
      # out-of-vocabulary bigram filter in tools/build_lm.py, the count comparison and the counting lexicon rule.
      # Stdlib only; experiments/s2-classes/test_cluster.py needs numpy and runs in `make test`.
      - name: model-v5 build scripts (Python)
        run: python3 -W ignore -m unittest tools/test_build_lm.py experiments/s2/test_extra_lexicon.py experiments/model-v5/test_compare_counts.py experiments/model-v5/test_count_lexicon.py

      # docs/contracts/kn-core.md: the SJKN0002 writer and lm.py reader, and the kn-tiny golden is the generator's current output.
      - name: Kneser-Ney side file (Python)
        run: python3 -W ignore -m unittest tools/test_kn_cont.py

      # docs/contracts/sbench.md and sbench-v2.md: the benchmark tool's guards (frozen set hashes, settings table and tags,
      # rowstats scoring, dump cross-check, replay consistency) against a fake CLI; no builds, no private data.
      - name: Benchmark tool (Python)
        run: python3 -m unittest tools/test_bench.py

      # docs/contracts/kpi.md: the per-version KPI table rules and the replay model checks, synthetic JSON and fake binaries.
      - name: KPI table tool (Python)
        run: python3 -W ignore -m unittest tools/test_kpi.py

      # docs/contracts/zhen-mixed.md section 3.4 and 5.6: the English word list builder (filter, cut, sort, input hash), synthetic input.
      - name: English word list builder (Python)
        run: python3 -m unittest tools/test_build_english_words.py

      # tools/build_overlay.py manual words: row checks, and the `manual` tail of overlay-add.tsv equals manual_rows() today (no dumps).
      - name: Overlay manual words (Python)
        run: python3 -m unittest tools/test_build_overlay.py

      # docs/contracts/colloquial-term.md section 3.6: the attribution list builder (per-source sums, the stop conditions), synthetic input.
      - name: Colloquial attribution list (Python)
        run: python3 -W ignore -m unittest tools/test_build_attribution.py

      # docs/contracts/holdout-refresh.md section 8: the held-out containment guard (tools/holdout_guard.py report, build_counts --holdout-guard), synthetic input and a fake conversion table.
      - name: Holdout guard (Python)
        run: python3 -W ignore -m unittest tools/test_holdout_guard.py

      # docs/contracts/x0c-compare.md acceptance 5: score_0c.py and versus.py against a fake model (input layout, 64-character
      # context, log10 scale, unscorable rows, covered-only comparison). They need numpy (not onnxruntime, not the weights),
      # which the runner may not have, so it runs in the throwaway venv built earlier in the job ("Python venv with numpy").
      #
      # docs/contracts/trigram-core.md slice A: tools/test_build_trigram.py (the SJT30001 builder, reader and scorer, the toy golden
      # file check, and lm_eval.py's loading rules) needs numpy too, so it runs in the same venv.
      - name: X0c scoring and comparison, trigram table (Python)
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/x0c-venv/bin/python" -W ignore -m unittest experiments/x0c/test_x0c.py
          "$RUNNER_TEMP/x0c-venv/bin/python" -W ignore -m unittest tools/test_build_trigram.py

  # docs/contracts/ci-speed.md: the debug test run, beside `core` instead of before it (debug 455 s and release 252 s used to run
  # one after the other). Skipped exactly when `core` is.
  core-debug:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: xcode-27
    # Measured 4.5-6.5 minutes (research log 2026-10-17, CI speed); a hung FFI child process should not hold the runner for the
    # 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Pinned to the toolchain the golden files were generated with: scores
      # must be bit-identical to the Python reference, and a codegen change
      # has already moved one result by 1 ulp (docs/contracts/s3a.md section 9,
      # powf lowered to exp10). The action is pinned to a master commit, as its
      # README recommends; the `stable` branch is regenerated on every merge.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.97.1

      # The bigram model is not in git (docs/PLAN.md S2c); it is the model-v6
      # release asset, its word-class table (S2k) is the classes-v5 asset and its
      # Kneser-Ney side file (kn-core) is the kn-v1 asset. The small model of
      # 語意校正 (S7c-2b) is the sj-sr-6-14m asset (會意 SJ-SR-6-14M, SJTL0004: it records model-v6's and kn-v1's hashes).
      # The trigram table of the formal profile (trigram-core) is the sj-cx-1-7.7m asset (bound to model-v6's hash).
      # The colloquial table (常談 SJ-CL-1-68K, colloquial-term.md) and its attribution list are the sj-cl-1-68k assets.
      # Checking them here fails the run in seconds with a clear message instead
      # of after the build. The hashes are checked against data/bigram.sjlm.sha256,
      # data/classes.sjc.sha256, data/kn.sjkn.sha256, data/tinylm.sjtl.sha256, data/trigram.sjt3.sha256, data/colloquial.sjlm.sha256 and data/colloquial-attribution.tsv.sha256 (also read by build-app.sh and release.yml);
      # cli/tests/golden.rs repeats the first two, so a model switch updates both (docs/data-files.md).
      - name: Fetch the language model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download model-v6 --repo "$GITHUB_REPOSITORY" -p bigram.sjlm -D data/lm
          shasum -a 256 -c data/bigram.sjlm.sha256
          gh release download classes-v5 --repo "$GITHUB_REPOSITORY" -p classes.sjc -D data/lm
          shasum -a 256 -c data/classes.sjc.sha256
          gh release download kn-v1 --repo "$GITHUB_REPOSITORY" -p kn.sjkn -D data/lm
          shasum -a 256 -c data/kn.sjkn.sha256
          gh release download sj-sr-6-14m --repo "$GITHUB_REPOSITORY" -p tinylm.sjtl -D data/lm
          shasum -a 256 -c data/tinylm.sjtl.sha256
          gh release download sj-cx-1-7.7m --repo "$GITHUB_REPOSITORY" -p trigram.sjt3 -D data/lm
          shasum -a 256 -c data/trigram.sjt3.sha256
          gh release download sj-cl-1-68k --repo "$GITHUB_REPOSITORY" -p colloquial.sjlm -p colloquial-attribution.tsv -D data/lm
          shasum -a 256 -c data/colloquial.sjlm.sha256 data/colloquial-attribution.tsv.sha256

      - name: Tests (debug)
        run: |
          sysctl -n hw.ncpu hw.memsize
          RUSTC_BOOTSTRAP=1 cargo test --locked -- -Z unstable-options --report-time

  # Probe: the debug run on Linux, one job per package.
  debug-linux:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pkg: [core, cli]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.97.1
      - name: Fetch the language model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download model-v6 --repo "$GITHUB_REPOSITORY" -p bigram.sjlm -D data/lm
          gh release download classes-v5 --repo "$GITHUB_REPOSITORY" -p classes.sjc -D data/lm
          gh release download kn-v1 --repo "$GITHUB_REPOSITORY" -p kn.sjkn -D data/lm
          gh release download sj-sr-6-14m --repo "$GITHUB_REPOSITORY" -p tinylm.sjtl -D data/lm
          gh release download sj-cx-1-7.7m --repo "$GITHUB_REPOSITORY" -p trigram.sjt3 -D data/lm
          gh release download sj-cl-1-68k --repo "$GITHUB_REPOSITORY" -p colloquial.sjlm -p colloquial-attribution.tsv -D data/lm
          shasum -a 256 -c data/bigram.sjlm.sha256 data/classes.sjc.sha256 data/kn.sjkn.sha256 data/tinylm.sjtl.sha256 data/trigram.sjt3.sha256 data/colloquial.sjlm.sha256 data/colloquial-attribution.tsv.sha256
      - name: Tests (debug)
        run: |
          nproc; free -g
          RUSTC_BOOTSTRAP=1 cargo test --locked -p ${{ matrix.pkg }} -- -Z unstable-options --report-time --skip predict_matches_python_golden --skip sw_probe_matches_python_golden_byte_for_byte

  # The Swift input method (docs/contracts/s3b.md section 3, app-sandbox.md
  # section 2.6): the ad-hoc sandboxed builds, the container migration, the
  # Swift tests through the real core and model, the bundled selftest,
  # acceptance checks 2, 3 and 6 of s3b section 10, the entitlement and
  # Sparkle mutations, and the installer.
  shell:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # The input of the English word list (SymSpell, pinned commit; build-app.sh downloads it when missing and checks its SHA-256
      # either way, so a bad cache is only a miss). The key follows tools/build_english_words.py, where the pins live.
      - name: Cache the English word list input
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/shanjie/english
          key: symspell-${{ hashFiles('tools/build_english_words.py') }}

      # The same toolchain as the core and core-debug jobs and release.yml:
      # libcore.a is built by every job that links it.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.97.1

      - name: Fetch the language model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download model-v6 --repo "$GITHUB_REPOSITORY" -p bigram.sjlm -D data/lm
          shasum -a 256 -c data/bigram.sjlm.sha256
          gh release download classes-v5 --repo "$GITHUB_REPOSITORY" -p classes.sjc -D data/lm
          shasum -a 256 -c data/classes.sjc.sha256
          gh release download kn-v1 --repo "$GITHUB_REPOSITORY" -p kn.sjkn -D data/lm
          shasum -a 256 -c data/kn.sjkn.sha256
          gh release download sj-sr-6-14m --repo "$GITHUB_REPOSITORY" -p tinylm.sjtl -D data/lm
          shasum -a 256 -c data/tinylm.sjtl.sha256
          gh release download sj-cx-1-7.7m --repo "$GITHUB_REPOSITORY" -p trigram.sjt3 -D data/lm
          shasum -a 256 -c data/trigram.sjt3.sha256
          gh release download sj-cl-1-68k --repo "$GITHUB_REPOSITORY" -p colloquial.sjlm -p colloquial-attribution.tsv -D data/lm
          shasum -a 256 -c data/colloquial.sjlm.sha256 data/colloquial-attribution.tsv.sha256

      # docs/contracts/app-sandbox.md section 2.6, in its order: no step before
      # step 3 launches any sandboxed build. cargo test runs in the core and
      # core-debug jobs, so only the Swift tests run here.
      # Step 0: the default build has the development ID, the names of the
      # section 2.3 table, and no migration list. Build only.
      - name: "Step 0: default build (development ID), build only"
        shell: bash
        run: |
          set -euo pipefail
          make bundle OUT_DIR=build/default
          APP="build/default/善解（開發版）.app"
          pb() { /usr/libexec/PlistBuddy -c "Print :$1" "$2"; }
          ID=$(pb CFBundleIdentifier "$APP/Contents/Info.plist")
          echo "default CFBundleIdentifier: $ID"
          [ "$ID" = com.nyanako.inputmethod.shanjie.dev ]
          [ "$(pb CFBundleDisplayName "$APP/Contents/Info.plist")" = 善解（開發版） ]
          [ "$(pb CFBundleName "$APP/Contents/Info.plist")" = "Shanjie (Dev)" ]
          [ "$(pb CFBundleDisplayName "$APP/Contents/Resources/zh-Hant.lproj/InfoPlist.strings")" = 善解（開發版） ]
          [ "$(pb CFBundleDisplayName "$APP/Contents/Resources/en.lproj/InfoPlist.strings")" = "Shanjie (Dev)" ]
          [ ! -e "$APP/Contents/Resources/container-migration.plist" ]
          [ ! -e build/default/善解輸入法.app ]

      - name: "Step 1: shipping-ID build, build only"
        shell: bash
        run: |
          set -euo pipefail
          make bundle BUNDLE_ID=com.nyanako.inputmethod.shanjie
          M="build/善解輸入法.app/Contents/Resources/container-migration.plist"
          plutil -p "$M"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :Move:0' "$M")" = '${ApplicationSupport}/shanjie' ]

      - name: "Step 2: throwaway build with no migration list, build only"
        run: make bundle BUNDLE_ID=com.nyanako.inputmethod.shanjie.ci-nomanifest OUT_DIR=build/nomanifest

      # Step 2a: check-app.sh's local guard, verified here rather than on a
      # maintainer's machine: outside CI it must refuse to run a shipping-ID
      # build and must not have created the shipping container; with SKIP_RUN=1
      # it passes checks 2 and 3.
      - name: "Step 2a: check-app.sh refuses a shipping-ID run outside CI"
        shell: bash
        run: |
          set -euo pipefail
          rc=0
          CI='' EXPECTED_BUNDLE_ID=com.nyanako.inputmethod.shanjie scripts/check-app.sh "build/善解輸入法.app" > "$RUNNER_TEMP/2a.out" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/2a.out"
          [ "$rc" -ne 0 ] || { echo "error: check-app.sh ran a shipping-ID build with CI unset" >&2; exit 1; }
          grep -q 'check 6 refused' "$RUNNER_TEMP/2a.out"
          [ ! -e "$HOME/Library/Containers/com.nyanako.inputmethod.shanjie" ] || { echo "error: the shipping container exists" >&2; exit 1; }
          CI='' SKIP_RUN=1 EXPECTED_BUNDLE_ID=com.nyanako.inputmethod.shanjie scripts/check-app.sh "build/善解輸入法.app"

      # Step 3: the first sandboxed launches in this job (the script prints
      # sw_vers). A TCC prompt while reading a container would hang here
      # (contract N6), hence the timeout.
      - name: "Step 3: container migration (shipping ID), and no list, no move"
        timeout-minutes: 10
        run: scripts/test-sandbox-migration.sh "build/善解輸入法.app" "build/nomanifest/善解（開發版）.app"

      - name: "Step 4: the migration test refuses outside CI and with a temporary HOME"
        shell: bash
        run: |
          set -euo pipefail
          for ci in "" true; do
            T=$(mktemp -d "$RUNNER_TEMP/refuse.XXXXXX")
            rc=0
            CI="$ci" HOME="$T" scripts/test-sandbox-migration.sh "build/善解輸入法.app" "build/nomanifest/善解（開發版）.app" > "$T.out" 2>&1 || rc=$?
            cat "$T.out"
            [ "$rc" -ne 0 ] || { echo "error: not refused with CI='$ci' HOME=$T" >&2; exit 1; }
            [ -z "$(ls -A "$T")" ] || { echo "error: the refused run wrote into $T" >&2; exit 1; }
            [ -n "$ci" ] || grep -q 'refused: CI is not true' "$T.out"
          done
          grep -q "is not this account's home directory" "$T.out"

      # release.yml's CI gate against a stub gh: a tag on an appcast.xml-only commit uses its parent's run.
      - name: CI gate script
        run: scripts/test-check-ci-gate.sh

      # The model list of the About page (about-models.md): scripts/check-models.sh on fake folders.
      - name: Model list check
        run: scripts/test-check-models.sh

      # Step 5: install-ime.sh file handling with a stub app in a temporary HOME; nothing can be registered.
      - name: "Step 5: install script file handling"
        run: scripts/test-install-ime.sh

      # Includes the log-stream test (acceptance 5): it needs /usr/bin/log
      # stream, which the runner's user can run.
      # --parallel starts one xctest process per test method (the log prints `[n/247] Testing Class/method`;
      # docs/contracts/ci-speed.md). Trade-off: state that leaks from one test into the next inside one process is no longer
      # caught here, only by the serial `make test-swift`. --parallel drops XCTest's `Executed N tests` summary, so the number
      # of test cases is printed from the xUnit file (it does not mark XCTSkip, so there is no skip count to print).
      - name: "Step 5: Swift tests"
        run: |
          set -euo pipefail
          swift test --package-path macos --force-resolved-versions --parallel --xunit-output "$RUNNER_TEMP/swift-tests.xml"
          python3 -c 'import sys, xml.etree.ElementTree as E; print("swift tests: %d testcases" % sum(1 for _ in E.parse(sys.argv[1]).iter("testcase")))' "$RUNNER_TEMP/swift-tests.xml"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: swift-tests-xunit
          path: ${{ runner.temp }}/swift-tests.xml

      # Step 6: the bundled selftest with a per-run throwaway ID (no migration
      # list); its container must not exist before and must exist after. The
      # shipping ID's selftest already ran in steps 3 and 7.
      - name: "Step 6: bundled selftest (throwaway ID)"
        shell: bash
        run: |
          set -euo pipefail
          ID="com.nyanako.inputmethod.shanjie.selftest-$GITHUB_RUN_ID"
          C="$HOME/Library/Containers/$ID"
          [ ! -e "$C" ] || { echo "error: $C exists before the selftest" >&2; exit 1; }
          make selftest-bundled SELFTEST_BUNDLE_ID="$ID"
          [ -d "$C" ] || { echo "error: no $C after the selftest: not sandboxed" >&2; exit 1; }
          echo "ok: $C absent before, present after"

      # Step 7: s3b section 10 acceptance 2, 3 and 6 on the shipping build.
      - name: "Step 7: acceptance checks 2, 3 and 6"
        run: EXPECTED_BUNDLE_ID=com.nyanako.inputmethod.shanjie scripts/check-app.sh "build/善解輸入法.app"

      # Step 8: ten changed copies of the shipping build against
      # check-entitlements.sh and check-app.sh (security review F1, F7); none is
      # launched.
      - name: "Step 8: entitlement and Sparkle mutations"
        run: scripts/test-sandbox-mutations.sh "build/善解輸入法.app"

      # Step 9: docs/contracts/s3c-installer.md section 6, acceptance 1: the
      # installer around the shipping build of step 1, inspected only (never launched).
      - name: "Step 9: installer"
        run: |
          make installer
          scripts/check-installer.sh

      # Contract section 14.5, acceptance 1 and 2: render-cask.sh's checks, then brew style on a
      # rendered cask (brew applies the cask rules only under a Casks/ directory).
      - name: Homebrew cask
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ANALYTICS: "1"
        run: |
          set -euo pipefail
          scripts/test-render-cask.sh
          mkdir -p "$RUNNER_TEMP/cask/Casks"
          scripts/render-cask.sh 0.0.0 "$(printf '0%.0s' $(seq 64))" > "$RUNNER_TEMP/cask/Casks/shanjie.rb"
          cd "$RUNNER_TEMP/cask"
          brew style Casks/shanjie.rb

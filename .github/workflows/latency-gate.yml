name: Latency gate

# Two latency gates measured on one macOS runner, the arms alternating (old, new, old, new) so that both see the same machine
# state: scripts/ci/latency_gate.py says what is measured, how it is read and what the gates are.
#   (A) TREE_A, one set of binaries, the tree's own small model against the candidate file of a draft release
#   (B) TREE_BASE against TREE_HEAD
# The three trees are fixed commits, checked out beside this branch's own checkout (which only supplies scripts/ci).
env:
  TREE_A: c93a539724b45f80461345a4b0db5ba91275e34c
  TREE_BASE: 4f7a831cdf2c06c4b097afbc8dd5b33cb95825d6
  TREE_HEAD: 32319266c67480d5baa144cd451b337a96469420
  # The candidate small model: an asset of a draft release (a draft has no tag to look it up by, so the release id is used).
  NEW_MODEL_RELEASE_ID: "454336190"
  NEW_MODEL_ASSET: blp-20261012-int8-v6.sjtl
  NEW_MODEL_SHA256: 5dce15a6077561aae15e3b6166aaf1cca0a9184ee03032b912d5700f91c37730
  ROUNDS: "2"

on:
  push:
    branches: [ci/latency-gate]
  workflow_dispatch:

concurrency:
  group: latency-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  measure:
    # The runner of ci.yml's macOS jobs: the small model's rerank runs on Accelerate here, as in the App.
    runs-on: xcode-27
    timeout-minutes: 120
    # A draft release is only visible to a token that can write contents; this is the only job, and no checkout keeps the token.
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: This branch (scripts/ci)
        timeout-minutes: 5
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: gate
          persist-credentials: false

      - name: Tree (A)
        timeout-minutes: 5
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.TREE_A }}
          path: a
          persist-credentials: false

      - name: Tree (B) base
        timeout-minutes: 5
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.TREE_BASE }}
          path: base
          persist-credentials: false

      - name: Tree (B) head
        timeout-minutes: 5
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.TREE_HEAD }}
          path: head
          persist-credentials: false

      # The pinned toolchain of ci.yml (why: its comment).
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        timeout-minutes: 10
        with:
          toolchain: 1.97.1

      - name: The trees are the commits named above
        timeout-minutes: 2
        run: |
          set -euo pipefail
          [ "$(git -C a rev-parse HEAD)" = "$TREE_A" ]
          [ "$(git -C base rev-parse HEAD)" = "$TREE_BASE" ]
          [ "$(git -C head rev-parse HEAD)" = "$TREE_HEAD" ]
          sw_vers
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          uptime

      # One download (the base tree's scripts/fetch-models.sh), copied into the other two trees; every tree then checks the files
      # against its own data/*.sha256, so a tree that names another model set fails here instead of measuring the wrong files.
      - name: Models of the three trees
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base/scripts/fetch-models.sh
          for t in a head; do
            mkdir -p "$t/data/lm"
            cp base/data/lm/* "$t/data/lm/"
          done
          for t in a base head; do
            (cd "$t" && shasum -a 256 -c data/*.sha256)
          done
          mkdir -p "$RUNNER_TEMP/models"
          cp a/data/lm/tinylm.sjtl "$RUNNER_TEMP/models/old.sjtl"

      - name: The candidate small model (draft release asset)
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          aid=$(gh api "repos/$GITHUB_REPOSITORY/releases/$NEW_MODEL_RELEASE_ID" --jq ".assets[] | select(.name == \"$NEW_MODEL_ASSET\") | .id")
          [[ "$aid" =~ ^[0-9]+$ ]] || { echo "error: release $NEW_MODEL_RELEASE_ID has no asset $NEW_MODEL_ASSET (got '$aid')" >&2; exit 1; }
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$aid" > "$RUNNER_TEMP/models/new.sjtl"
          echo "$NEW_MODEL_SHA256  $RUNNER_TEMP/models/new.sjtl" | shasum -a 256 -c

      # Each tree builds in its own target folder: the evaluation CLI and the test executable carry the path of the tree they were built in.
      - name: Build (A), the evaluation CLI and the test executable of core/tests/engine_predict.rs
        timeout-minutes: 30
        working-directory: a
        run: |
          set -euo pipefail
          cargo build --release --locked -p cli --bin shanjie-eval
          rc=0
          cargo test --release --locked -p core --test engine_predict --no-run --color never 2> "$RUNNER_TEMP/test-build.err" || rc=$?
          cat "$RUNNER_TEMP/test-build.err" >&2
          [ "$rc" = 0 ]
          exe=$(sed -n 's/^ *Executable tests\/engine_predict\.rs (\(.*\))$/\1/p' "$RUNNER_TEMP/test-build.err")
          # The job sets CARGO_TERM_COLOR=always; without --color never the line carries escape codes and the sed finds nothing.
          # An empty match would turn into "$PWD/", a directory, which -x alone accepts: require a regular file.
          [ -n "$exe" ] || { echo "error: no 'Executable tests/engine_predict.rs' line in the cargo output" >&2; exit 1; }
          case "$exe" in /*) ;; *) exe="$PWD/$exe";; esac
          [ -f "$exe" ] && [ -x "$exe" ] || { echo "error: no test executable ('$exe')" >&2; exit 1; }
          echo "TEST_EXE=$exe" >> "$GITHUB_ENV"

      - name: Build (B) base, the evaluation CLI and shanjie-replay
        timeout-minutes: 30
        working-directory: base
        run: cargo build --release --locked -p cli --bin shanjie-eval --bin shanjie-replay

      - name: Build (B) head, the evaluation CLI and shanjie-replay
        timeout-minutes: 30
        working-directory: head
        run: cargo build --release --locked -p cli --bin shanjie-eval --bin shanjie-replay

      # Rows whose every left context is 64 Han characters, put together from tracked public rows (the script says how).
      - name: Long-context rows
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python3 gate/scripts/ci/latency_gate.py --self-test
          python3 gate/scripts/ci/longctx_rows.py --out "$RUNNER_TEMP/longctx.txt"

      # Exit 0: every gate passes; 1: a gate fails; 2: a run of the old model or the base tree failed (no verdict). The result table goes to the job summary.
      - name: Measure
        timeout-minutes: 60
        run: |
          set -euo pipefail
          uptime
          python3 gate/scripts/ci/latency_gate.py --a a --base base --head head \
            --old-model "$RUNNER_TEMP/models/old.sjtl" --new-model "$RUNNER_TEMP/models/new.sjtl" --new-sha256 "$NEW_MODEL_SHA256" \
            --lc-rows "$RUNNER_TEMP/longctx.txt" --test-exe "$TEST_EXE" --rounds "$ROUNDS" --out "$GITHUB_WORKSPACE/latency-gate"

      # result.txt, raw.tsv and every run's stdout, stderr and key times (numbers and summary lines of public rows only).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        timeout-minutes: 5
        with:
          name: latency-gate
          path: latency-gate
          if-no-files-found: warn

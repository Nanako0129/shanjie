# CodeRabbit configuration (modeled on syrtis).
# Schema: https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json

language: zh-TW

reviews:
  # The holdout set is never read during development (eval/README.md); keep
  # it out of reviews entirely rather than asking the reviewer not to quote it.
  path_filters:
    - "!eval/holdout/**"

  auto_review:
    # 0 disables the pause; at the default of 5, automatic review stops silently
    # once a pull request has five reviewed commits.
    auto_pause_after_reviewed_commits: 0

  pre_merge_checks:
    docstrings:
      # Coverage counts every touched function, not only new ones; off.
      mode: off

  path_instructions:
    - path: "core/include/shanjie.h"
      instructions: |
        The C ABI contract lives in docs/contracts/s3a.md section 6. Every
        declaration here must match the #[repr(C)] types and extern "C"
        signatures in core/src/ffi.rs (field order, types, return codes).
    - path: "core/src/**"
      instructions: |
        Privacy rule R2 (docs/PLAN.md section 7; coding rules in
        docs/contracts/s3a.md section 6): errors, panic messages and stderr
        must never contain input text (readings, composition, candidates); no
        derive(Debug) on types that hold input text. Slicing a str by byte
        offset is allowed only at known char boundaries (char_indices, or the
        recorded (offset, length) of the lexicon string pool, see
        docs/contracts/l.md); flag slicing at computed offsets that may fall
        inside a character. `unsafe` is allowed only in core/src/ffi.rs.
    - path: "eval/golden/**"
      instructions: |
        Golden files are generated by the Python reference or the CLI with the
        exact commands in docs/PLAN.md; a change must be explained by the
        commit that regenerates them, never hand-edited.

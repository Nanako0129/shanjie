[package]
name = "cli"
version = "0.0.0"
edition = "2021"
# Two binaries since engine-replay; `cargo run -p cli` (CI, Makefile, tools, docs) stays shanjie-eval.
default-run = "shanjie-eval"

[[bin]]
name = "shanjie-eval"
path = "src/main.rs"

[[bin]]
name = "shanjie-replay"
path = "src/bin/replay.rs"

[dependencies]
core = { path = "../core" }

[workspace]
members = ["core", "cli"]
resolver = "2"

[profile.release]
debug = false

# Debug tests keep debug assertions and overflow checks. Unoptimised, the per-key prediction scan made the dev302
# replays outgrow CI's 20-minute core job (replay_standard_formal 79 s locally); opt-level 1 brings it to 9 s.
[profile.test]
opt-level = 1
